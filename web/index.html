<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pump Control</title>
<!-- MQTT over WebSockets (browser build). Global: mqtt -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<style>
  /* Minimal, plain. The page is fully usable even without this CSS. */
  body { max-width: 640px; margin: 1rem auto; padding: 0 1rem;
         font-family: sans-serif; line-height: 1.5; color: #000; background: #fff; }
  h1 { font-size: 1.3rem; }
  fieldset { margin-bottom: 1rem; }
  label { display: block; margin: .5rem 0 .15rem; }
  input { width: 100%; max-width: 360px; padding: .35rem; }
  input[type=checkbox] { width: auto; }
  button { padding: .4rem .8rem; margin-right: .5rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { border: 1px solid #999; padding: .4rem .5rem; text-align: left; }
  .mono { font-family: monospace; }
  #status { margin: .5rem 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Pump Control</h1>

<p id="status">Broker: <span id="brokerText">disconnected</span>
  &middot; Device: <span id="deviceText">unknown</span></p>

<!-- LOGIN -->
<form id="loginForm" autocomplete="off">
  <fieldset>
    <legend>Connect to broker</legend>
    <label for="host">Broker host</label>
    <input id="host" class="mono" placeholder="xxxxxxxx.s1.eu.hivemq.cloud" required>

    <label for="wsPort">WebSocket port</label>
    <input id="wsPort" class="mono" value="8884" inputmode="numeric" required>

    <label for="mqttUser">MQTT username</label>
    <input id="mqttUser" required>

    <label for="mqttPass">MQTT password</label>
    <input id="mqttPass" type="password" required>

    <label><input id="remember" type="checkbox"> Remember on this device</label>

    <p><button type="submit" id="connectBtn">Connect</button></p>
  </fieldset>
</form>
<p id="loginNote"><small>HiveMQ Cloud secure WebSocket port is 8884. Commands are
  controlled by your broker's user permissions (ACLs).</small></p>

<!-- CONTROL -->
<div id="panel" hidden>
  <p><button id="disconnectBtn">Disconnect</button></p>
  <table>
    <thead><tr><th>Motor</th><th>State</th><th>Control</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="waiting"><small>Waiting for the pump to report in&hellip;</small></p>
</div>

<script>
(function () {
  "use strict";
  var TOPIC_CMD = "pump/cmd", TOPIC_STATE = "pump/state", TOPIC_STATUS = "pump/status";
  var LS_KEY = "pump-control-conn";
  var client = null, lastMotors = null;
  var $ = function (id) { return document.getElementById(id); };

  function setBroker(t) { $("brokerText").textContent = t; }
  function setDevice(t) { $("deviceText").textContent = t; }

  function loadSaved() {
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (!s) return;
      if (s.host) $("host").value = s.host;
      if (s.wsPort) $("wsPort").value = s.wsPort;
      if (s.mqttUser) $("mqttUser").value = s.mqttUser;
      if (s.mqttPass) $("mqttPass").value = s.mqttPass;
      $("remember").checked = true;
    } catch (e) {}
  }
  function saveOrClear(data) {
    try {
      if ($("remember").checked) localStorage.setItem(LS_KEY, JSON.stringify(data));
      else localStorage.removeItem(LS_KEY);
    } catch (e) {}
  }

  function render(motors) {
    lastMotors = motors;
    $("waiting").hidden = motors.length > 0;
    var tbody = $("rows");
    tbody.innerHTML = "";
    var connected = client && client.connected;
    motors.forEach(function (m) {
      var tr = document.createElement("tr");
      var tdName = document.createElement("td");
      tdName.textContent = (m.name || ("Motor " + m.id)) + " (#" + m.id + ")";
      var tdState = document.createElement("td");
      tdState.textContent = m.state;
      var tdCtl = document.createElement("td");
      var bStart = document.createElement("button");
      bStart.textContent = "Start"; bStart.disabled = !connected;
      bStart.onclick = function () { sendCmd(m.id, "start"); };
      var bStop = document.createElement("button");
      bStop.textContent = "Stop"; bStop.disabled = !connected;
      bStop.onclick = function () { sendCmd(m.id, "stop"); };
      tdCtl.appendChild(bStart); tdCtl.appendChild(bStop);
      tr.appendChild(tdName); tr.appendChild(tdState); tr.appendChild(tdCtl);
      tbody.appendChild(tr);
    });
  }

  function sendCmd(id, cmd) {
    if (!client || !client.connected) return;
    client.publish(TOPIC_CMD, id + ":" + cmd, { qos: 0 });  // payload: "<id>:<cmd>"
  }

  function connect(host, wsPort, user, pass) {
    var url = "wss://" + host + ":" + wsPort + "/mqtt";
    setBroker("connecting…");
    var opts = {
      username: user, password: pass,
      clientId: "pump-web-" + Math.random().toString(16).slice(2, 10),
      clean: true, reconnectPeriod: 4000, connectTimeout: 12000
    };
    try { client = mqtt.connect(url, opts); }
    catch (e) { setBroker("bad URL"); return; }

    client.on("connect", function () {
      setBroker("connected");
      $("loginForm").hidden = true; $("loginNote").hidden = true; $("panel").hidden = false;
      client.subscribe([TOPIC_STATE, TOPIC_STATUS]);
      render(lastMotors || []);
    });
    client.on("reconnect", function () { setBroker("reconnecting…"); });
    client.on("close",     function () { setBroker("disconnected"); });
    client.on("offline",   function () { setBroker("offline"); });
    client.on("error", function (err) {
      setBroker("error");
      $("loginNote").textContent = "Connection error: " + (err && err.message ? err.message : err);
      $("loginNote").hidden = false;
    });
    client.on("message", function (topic, payload) {
      var text = payload.toString();
      if (topic === TOPIC_STATE) {
        try { var o = JSON.parse(text); if (o && o.motors) render(o.motors); } catch (e) {}
      } else if (topic === TOPIC_STATUS) {
        setDevice(text === "online" ? "online" : "offline");
      }
      if (lastMotors) render(lastMotors);
    });
  }

  function disconnect() {
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    setBroker("disconnected"); setDevice("unknown");
    $("panel").hidden = true; $("loginForm").hidden = false; $("loginNote").hidden = false;
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var host = $("host").value.trim(), wsPort = $("wsPort").value.trim();
    var user = $("mqttUser").value.trim(), pass = $("mqttPass").value;
    saveOrClear({ host: host, wsPort: wsPort, mqttUser: user, mqttPass: pass });
    connect(host, wsPort, user, pass);
  });
  $("disconnectBtn").addEventListener("click", disconnect);

  loadSaved();
})();
</script>
</body>
</html>
